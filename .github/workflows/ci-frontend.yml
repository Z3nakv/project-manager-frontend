name: CI - Frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

  e2e:
    needs: lint-and-build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: Z3nakv/project-manager-backend
          path: backend
          # Solo necesario si el repo del backend es privado:
          # token: ${{ secrets.BACKEND_REPO_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Start backend
        working-directory: backend
        run: npm run dev &
        env:
          PORT: 5000
          DATABASE_URL: mongodb://localhost:27017/treework-e2e
          FRONTEND_URL: http://localhost:5173
          JWT_SECRET: e2e-test-jwt-secret
          REFRESH_JWT_SECRET: e2e-test-refresh-secret
          NODE_ENV: test

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health; then
              echo "Backend listo"
              exit 0
            fi
            echo "Esperando al backend... intento $i"
            sleep 2
          done
          echo "El backend no respondió a tiempo"
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test
        env:
          CI: true
          E2E_API_URL: http://localhost:5000/api

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  ai-review:
    needs: lint-and-build
    # Solo corre en PRs, no en pushes directos a main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gemini AI Code Review
        uses: sshnaidm/gemini-code-review-action@v2
        with:
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
          add-files: 'true'
          context-lines: '20'
          review-title: '🤖 Revisión de Gemini AI'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}