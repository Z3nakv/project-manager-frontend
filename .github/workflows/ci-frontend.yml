name: CI - Frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

  e2e:
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Debug env vars
        run: |
          echo "--- Variables de entorno relevantes ---"
          echo "VITE_API_URL=$VITE_API_URL"
          echo "E2E_API_URL=$E2E_API_URL"
          echo "--- Archivos .env presentes en el checkout ---"
          find . -maxdepth 2 -iname ".env*" 2>/dev/null || echo "no se encontraron archivos .env"

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  ai-review:
    needs: lint-and-build
    # Solo corre en PRs, no en pushes directos a main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gemini AI Code Review
        uses: sshnaidm/gemini-code-review-action@v2
        with:
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
          add-files: 'true'
          context-lines: '20'
          review-title: '🤖 Revisión de Gemini AI'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}